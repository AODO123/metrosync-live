name: metrosync-live
services:
  - name: web
    type: web
    instances: 1
    instance_types:
      - name: free
    ports:
      - port: 3000
        protocol: http
    routes:
      - path: /
    health_check:
      http_get:
        path: /health
        port: 3000
    env:
      PORT: "3000"
    build:
      builder: NIXPACKS
      run: npm start
